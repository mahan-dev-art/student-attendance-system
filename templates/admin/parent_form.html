{% extends 'admin/layout.html' %}{% block title %}{{ title }}{% endblock %}{% block page_head %}<div><span class="eyebrow">والد</span><h1>{{ title }}</h1></div>{% endblock %}{% block admin_content %}<form class="card form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>نام<input name="first_name" value="{{ parent.first_name if parent else '' }}" required></label><label>نام خانوادگی<input name="last_name" value="{{ parent.last_name if parent else '' }}" required></label><label>نام کاربری<input name="username" value="{{ parent.user.username if parent else '' }}" required></label><label>شماره تماس<input name="phone" value="{{ parent.phone if parent else '' }}"></label><label>رمز عبور<input type="password" name="password" {% if not parent %}required{% endif %} placeholder="{{ 'برای حفظ رمز فعلی خالی بگذارید' if parent else 'حداقل ۸ نویسه' }}"></label><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('admin.parents') }}">انصراف</a><button class="btn btn-primary">ذخیره</button></div></form>{% endblock %}
