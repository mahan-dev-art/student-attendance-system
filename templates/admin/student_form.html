{% extends 'admin/layout.html' %}{% block title %}{{ title }}{% endblock %}{% block page_head %}<div><span class="eyebrow">دانش‌آموز</span><h1>{{ title }}</h1></div>{% endblock %}{% block admin_content %}<form class="card form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>نام<input name="first_name" value="{{ student.first_name if student else '' }}" required></label><label>نام خانوادگی<input name="last_name" value="{{ student.last_name if student else '' }}" required></label><label>کد دانش‌آموزی<input name="student_code" value="{{ student.student_code if student else '' }}" required></label><label>شناسه کارت شناسه RFID<input name="rfid_uid" value="{{ student.rfid_uid if student else '' }}" required></label><label>پایه<input name="grade" value="{{ student.grade if student else '' }}" required></label><label>کلاس<input name="class_name" value="{{ student.class_name if student else '' }}" required></label><label>والد<select name="parent_id"><option value="">تعیین نشده</option>{% for p in parents %}<option value="{{ p.id }}" {% if student and student.parent_id==p.id %}selected{% endif %}>{{ p.full_name }} ({{ p.user.username }})</option>{% endfor %}</select></label><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('admin.students') }}">انصراف</a><button class="btn btn-primary">ذخیره</button></div></form>{% endblock %}
